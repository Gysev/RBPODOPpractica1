stages:
  - secret_scan
  - app_build
  - fuzz
  - docker_image

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  FFUF_VERSION: "2.1.0"

secret_scan:
  stage: secret_scan
  tags:
    - pracrica11
  image:
    name: gitleaks/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source "." --no-git --exit-code 1 --verbosity=info

app_build:
  stage: app_build
  tags:
    - pracrica11
  image: python:3.12-slim
  needs: ["secret_scan"]
  script:
    - pip install --no-cache-dir -r webapp/requirements.txt
    - python -m compileall webapp

fuzz:
  stage: fuzz
  tags:
    - pracrica11
  image: python:3.12-slim
  needs: ["app_build"]
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget ca-certificates
    - wget -q "https://github.com/ffuf/ffuf/releases/download/v${FFUF_VERSION}/ffuf_${FFUF_VERSION}_linux_amd64.tar.gz" -O /tmp/ffuf.tgz
    - tar -xzf /tmp/ffuf.tgz -C /usr/local/bin ffuf
  script:
    - pip install --no-cache-dir -r webapp/requirements.txt
    - ( cd webapp && python app.py & )
    - sleep 4
    - ffuf -u http://127.0.0.1:5000/FUZZ -w "$CI_PROJECT_DIR/fuzz/wordlist.txt" -mc 200,204,301,302 -t 20 -s

docker_image:
  stage: docker_image
  tags:
    - pracrica11
  image: docker:24-cli
  services:
    - docker:24-dind
  needs: ["fuzz"]
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - trivy config --exit-code 1 --severity HIGH,CRITICAL .
    - docker build -t "local:$CI_COMMIT_SHORT_SHA" .
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress "local:$CI_COMMIT_SHORT_SHA"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker tag "local:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker tag "local:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
