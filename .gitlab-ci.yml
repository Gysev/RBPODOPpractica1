stages:
  - secret_scan
  - app_build
  - fuzz
  - docker_image

variables:
  FFUF_VERSION: "2.1.0"

secret_scan:
  stage: secret_scan
  tags:
    - pracrica11
  image:
    name: ghcr.io/gitleaks/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source "." --no-git --exit-code 1 --log-level info

app_build:
  stage: app_build
  tags:
    - pracrica11
  image: python:3.12-slim
  needs: ["secret_scan"]
  script:
    - pip install --no-cache-dir -r webapp/requirements.txt
    - python -m compileall webapp

fuzz:
  stage: fuzz
  tags:
    - pracrica11
  image: python:3.12-slim
  needs: ["app_build"]
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget ca-certificates
    - wget -q "https://github.com/ffuf/ffuf/releases/download/v${FFUF_VERSION}/ffuf_${FFUF_VERSION}_linux_amd64.tar.gz" -O /tmp/ffuf.tgz
    - tar -xzf /tmp/ffuf.tgz -C /usr/local/bin ffuf
  script:
    - pip install --no-cache-dir -r webapp/requirements.txt
    - ( cd webapp && python app.py & )
    - sleep 4
    - ffuf -u http://127.0.0.1:5000/FUZZ -w "$CI_PROJECT_DIR/fuzz/wordlist.txt" -mc 200,204,301,302 -t 20 -s

trivy_dockerfile:
  stage: docker_image
  tags:
    - pracrica11
  image: ghcr.io/aquasecurity/trivy:latest
  needs: ["fuzz"]
  script:
    - trivy config --exit-code 1 --severity HIGH,CRITICAL .

docker_publish:
  stage: docker_image
  tags:
    - pracrica11
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: ["trivy_dockerfile"]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_JOB_TOKEN}" | base64 | tr -d '\n')
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}:latest"
      --cache=false

trivy_image:
  stage: docker_image
  tags:
    - pracrica11
  image: ghcr.io/aquasecurity/trivy:latest
  needs: ["docker_publish"]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_JOB_TOKEN
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --no-progress "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
