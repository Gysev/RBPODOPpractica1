name: Secret scan

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Не сканируем историю коммитов — достаточно контента после checkout.
          GITLEAKS_NO_GIT: "true"

  build:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Build (placeholder)
        run: echo "Build step skipped (secret scan already ran)."
